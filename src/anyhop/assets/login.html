<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfcfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1416" media="(prefers-color-scheme: dark)">
  <title>anyhop — sign in</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <button id="theme" class="icon-btn theme-corner" type="button" aria-label="Toggle appearance"></button>
  <div class="login-wrap">
    <form class="login" id="form">
      <div class="wordmark">
        <img class="wordmark-img" src="/wordmark.svg" alt="anyhop">
      </div>
      <p class="lead">Control Panel</p>
      <label class="eyebrow" for="token">Password or access token</label>
      <input id="token" name="token" type="password" autocomplete="off" spellcheck="false"
        placeholder="enter your password" autofocus>
      <button type="submit">Open dashboard</button>
      <p class="err" id="err">That token wasn't accepted. Check it and try again.</p>
      <p class="hint">
        Docker administrators can set <code>ANYHOP_WEB_PASSWORD</code> or mount
        <code>ANYHOP_WEB_PASSWORD_FILE</code>. Local installs can still run
        <code>anyhop ui</code> or use the secret from
        <code>~/.anyhop/control_api.json</code>.
      </p>
    </form>
  </div>

  <script type="module" src="/login.js"></script>
</body>

</html>
